version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: freeverse_postgres
    environment:
      POSTGRES_DB: freeverse_db
      POSTGRES_USER: freeverse_user
      POSTGRES_PASSWORD: freeverse_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freeverse_user -d freeverse_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
